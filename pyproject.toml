[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-automation-toolkit"
version = "0.1.0"
description = "Synthetic request workflow with local Graph and Teams mocks"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "jinja2>=3.1,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.14,<1"]
ci = ["playwright==1.56.0", "pymupdf>=1.26,<2", "pillow>=11,<13"]

[project.scripts]
process-toolkit = "process_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
process_automation = ["templates/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["process_automation"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
